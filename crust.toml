[project]
name = "tsnet"

[[targets]]
name = "tsnetc"
kind = "executable"
entry = "src/main.cr"

[targets.native]
sources = ["backend/metadata/link-options.c"]
link-inputs = ["artifacts/metadata-writer/Tsnet.Metadata.lib", "artifacts/metadata-writer/bootstrapperdll.obj"]
libraries = ["advapi32", "bcrypt", "crypt32", "iphlpapi", "kernel32", "mswsock", "ncrypt", "normaliz", "ntdll", "ole32", "oleaut32", "secur32", "user32", "version", "ws2_32"]
debug = false
